// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle:8.7.2')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    classpath('com.google.gms:google-services:4.4.2')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    // Singular MMP SDK is hosted on Singular's own Maven repo (not mavenCentral).
    // Added manually because eas.json production build SKIPS prebuild, so the
    // singular-react-native Expo config plugin (which normally injects this)
    // never runs. Keep in sync with that plugin.
    maven { url 'https://maven.singular.net/' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
