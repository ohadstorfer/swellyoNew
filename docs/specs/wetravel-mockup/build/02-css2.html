<style>
/* ── Trip list ─────────────────────────────────────────────────────────── */
.toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.search{position:relative; flex:1; min-width:220px; max-width:420px}
.search input{padding-left:32px}
.search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted)}
.seg{display:inline-flex; background:var(--panel-2); border-radius:var(--r-sm); padding:2px; gap:2px}
.seg button{padding:5px 11px; border:0; background:none; border-radius:4px; font-size:12.5px; font-weight:600; color:var(--muted); transition:background var(--t-fast) ease, color var(--t-fast) ease}
.seg button[aria-pressed="true"]{background:var(--bg); color:var(--text); box-shadow:var(--shadow-sm)}

.trip-row{
  display:grid; grid-template-columns:132px 1fr auto; gap:16px; align-items:center;
  padding:13px; background:var(--bg); border:1px solid var(--line); border-radius:var(--r-lg);
  margin-bottom:10px; box-shadow:var(--shadow-sm);
  transition:border-color var(--t-fast) ease, box-shadow var(--t-fast) ease, transform var(--t-fast) var(--ease-out);
}
.trip-row:hover{border-color:var(--line-strong); box-shadow:var(--shadow); transform:translateY(-1px)}
.trip-thumb{
  width:132px; height:96px; border-radius:var(--r); background-size:cover; background-position:center;
  position:relative; overflow:hidden; flex:none;
}
.trip-meta h3{font-size:16px; font-weight:700; letter-spacing:-.01em; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.trip-facts{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:7px; font-size:12.5px; color:var(--muted)}
.trip-facts span{display:inline-flex; align-items:center; gap:5px}
.trip-money{display:flex; align-items:center; gap:20px; margin-top:9px; font-size:12.5px}
.trip-money b{font-family:var(--display); font-size:14px; font-variant-numeric:tabular-nums; display:block; margin-top:1px}
.trip-money .l{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:600}
.trip-act{display:flex; flex-direction:column; align-items:flex-end; gap:9px}
.icon-btn{width:30px; height:30px; border-radius:var(--r-sm); border:1px solid transparent; background:none; color:var(--muted); display:grid; place-items:center; transition:background var(--t-fast) ease, color var(--t-fast) ease}
.icon-btn:hover{background:var(--panel-2); color:var(--text)}

.fill{height:5px; border-radius:999px; background:var(--panel-2); overflow:hidden; min-width:96px}
.fill i{display:block; height:100%; background:var(--cyan); border-radius:999px; transition:width 400ms var(--ease-out)}
.fill i.hot{background:var(--warn)}

/* ── Trip header ───────────────────────────────────────────────────────── */
.trip-head{display:grid; grid-template-columns:172px 1fr auto; gap:20px; align-items:start; margin-bottom:18px}
.trip-head .trip-thumb{width:172px; height:118px}
.trip-head h1{font-size:22px; font-weight:700; letter-spacing:-.02em}
.trip-head .sub{color:var(--muted); font-size:13.5px; margin-top:5px; display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.headstats{border-left:1px solid var(--line); padding-left:20px; display:grid; gap:6px; min-width:230px}
.headstat{display:flex; align-items:baseline; gap:12px; font-size:13px}
.headstat .l{color:var(--muted); flex:1; display:flex; align-items:center; gap:5px}
.headstat .v{font-family:var(--display); font-weight:700; font-variant-numeric:tabular-nums; font-size:14.5px}

.q{width:14px; height:14px; border-radius:50%; border:1px solid var(--line-strong); color:var(--muted); font-size:9px; display:inline-grid; place-items:center; cursor:help; flex:none; background:none; font-weight:700}
.q:hover{border-color:var(--cyan); color:var(--cyan-dark)}

/* ── Builder ───────────────────────────────────────────────────────────── */
.builder{display:grid; grid-template-columns:196px 1fr; gap:22px; align-items:start}
.builder-nav{display:grid; gap:1px; position:sticky; top:74px}
.builder-nav button{
  display:flex; align-items:center; gap:10px; padding:9px 11px; border:0; background:none;
  border-radius:var(--r-sm); font-size:13px; font-weight:600; color:var(--muted); text-align:left;
  transition:background var(--t-fast) ease, color var(--t-fast) ease;
}
.builder-nav button:hover{background:var(--panel-2); color:var(--text)}
.builder-nav button[aria-current="step"]{background:var(--cyan-tint); color:var(--cyan-dark)}
.step-n{width:20px; height:20px; border-radius:50%; border:1px solid currentColor; font-size:10.5px; display:grid; place-items:center; flex:none; opacity:.65}
.builder-nav button[aria-current="step"] .step-n{background:var(--cyan-dark); color:#fff; border-color:var(--cyan-dark); opacity:1}
.done .step-n{background:var(--ok); border-color:var(--ok); color:#fff; opacity:1}

.pkg{border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:10px; background:var(--bg)}
.pkg-top{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.pkg-top h4{font-size:14.5px; font-weight:700}
.pkg-plan{
  margin-top:11px; padding:10px 12px; border-radius:var(--r-sm); background:var(--panel);
  border:1px dashed var(--line-strong); display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  font-size:12.5px;
}
.pkg-plan b{font-variant-numeric:tabular-nums}

.numgrid{display:grid; grid-template-columns:repeat(6,1fr); border:1px solid var(--line-strong); border-radius:var(--r-sm); overflow:hidden}
.numgrid button{
  padding:9px 0; border:0; border-right:1px solid var(--line); border-bottom:1px solid var(--line);
  background:var(--bg); font-size:13px; font-weight:600; color:var(--text-2);
  transition:background var(--t-fast) ease, color var(--t-fast) ease;
}
.numgrid button:nth-child(6n){border-right:0}
.numgrid button:nth-last-child(-n+6){border-bottom:0}
.numgrid button:hover{background:var(--cyan-tint)}
.numgrid button[aria-pressed="true"]{background:var(--cyan); color:#fff}

.sched-row{display:grid; grid-template-columns:1fr 150px 128px; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line)}
.sched-row:last-child{border-bottom:0}
.sched-row .lbl{font-size:13px; font-weight:600}
.sched-row .fixed{font-size:13px; color:var(--muted)}
.sched-tot{display:flex; align-items:center; gap:10px; justify-content:flex-end; padding-top:12px; font-size:13px}
.sched-tot b{font-family:var(--display); font-size:15px; font-variant-numeric:tabular-nums}
.mismatch{color:var(--danger); font-weight:600}

.qrow{
  display:grid; grid-template-columns:auto 1fr 178px auto auto; gap:10px; align-items:center;
  padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-sm); margin-bottom:7px; background:var(--bg);
}
.qrow:hover{border-color:var(--line-strong)}
.grip{color:var(--line-strong); cursor:grab; display:grid; place-items:center}
.qrow input[type=text]{border-color:transparent; background:none; padding:5px 7px; font-weight:500}
.qrow input[type=text]:hover{border-color:var(--line)}
.req{font-size:11.5px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:5px; white-space:nowrap}
.req input{accent-color:var(--cyan-dark)}
.task-block{border:1px solid var(--line); border-radius:var(--r); padding:13px; margin-bottom:11px; background:var(--panel)}
.task-block > .qrow{background:var(--bg)}
.task-head{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.task-head h4{font-size:13.5px; font-weight:700}

/* ── Kanban ────────────────────────────────────────────────────────────── */
.kanban{display:grid; grid-auto-flow:column; grid-auto-columns:262px; gap:12px; overflow-x:auto; padding-bottom:12px}
.kcol{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:10px; min-height:220px}
.kcol-head{display:flex; align-items:center; gap:8px; margin-bottom:10px; padding:0 2px}
.kcol-head h4{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em}
.kcard{
  background:var(--bg); border:1px solid var(--line); border-radius:var(--r-sm); padding:11px;
  margin-bottom:8px; box-shadow:var(--shadow-sm); cursor:pointer;
  transition:transform var(--t-fast) var(--ease-out), box-shadow var(--t-fast) ease, border-color var(--t-fast) ease;
}
.kcard:hover{transform:translateY(-1px); box-shadow:var(--shadow); border-color:var(--line-strong)}
.kcard h5{font-size:13px; font-weight:600; margin:0 0 5px}
.kcard .who{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px}
.kcard .foot{display:flex; align-items:center; gap:8px; margin-top:9px; font-size:11.5px; color:var(--muted)}

.av{
  width:26px; height:26px; border-radius:50%; display:grid; place-items:center; flex:none;
  font-size:10.5px; font-weight:700; color:#fff; letter-spacing:.02em;
  background:linear-gradient(150deg,var(--cyan),var(--cyan-dark));
}
.av-lg{width:44px; height:44px; font-size:15px}
.av-sm{width:22px; height:22px; font-size:9.5px}

/* ── Chart ─────────────────────────────────────────────────────────────── */
.chart{display:flex; align-items:flex-end; gap:8px; height:190px; padding:14px 4px 0}
.bar-wrap{flex:1; display:flex; flex-direction:column; align-items:center; gap:7px; min-width:0}
.bar-stack{width:100%; max-width:46px; display:flex; flex-direction:column-reverse; gap:2px; flex:1; justify-content:flex-start}
.bar{width:100%; border-radius:3px; transition:height 500ms var(--ease-out); min-height:2px}
.bar-due{background:var(--cyan)}
.bar-past{background:var(--danger)}
.bar-x{font-size:11px; color:var(--muted); white-space:nowrap}
.legend{display:flex; gap:16px; font-size:12px; color:var(--muted); padding:0 4px 4px}
.legend i{width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:6px; vertical-align:middle}

.spark{display:block; width:100%; height:38px}

/* ── Phone ─────────────────────────────────────────────────────────────── */
.stage{
  background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:24px; display:flex; justify-content:center; gap:34px; flex-wrap:wrap;
  background-image:radial-gradient(circle at 1px 1px, var(--line-strong) 1px, transparent 0);
  background-size:22px 22px;
}
.phone{
  /* Fits any viewport: never taller than the space actually available, so the
     bottom dock — where Continue and Confirm booking live — is always reachable. */
  width:376px; height:clamp(560px, calc(100vh - 200px), 760px);
  border-radius:44px; background:#0f1416; padding:11px;
  box-shadow:0 26px 60px rgba(28,28,26,.26), 0 0 0 1px rgba(0,0,0,.35); flex:none; position:relative;
}
.phone-screen{
  width:100%; height:100%; border-radius:34px; background:#fff; overflow:hidden;
  position:relative; display:flex; flex-direction:column;
  font-family:var(--font); color:var(--app-ink);
}
.notch{
  position:absolute; top:11px; left:50%; transform:translateX(-50%);
  width:110px; height:26px; background:#0f1416; border-radius:999px; z-index:12;
}
.phone-scroll{flex:1; overflow-y:auto; overscroll-behavior:contain}
.phone-scroll::-webkit-scrollbar{width:0}
.status-bar{
  height:44px; display:flex; align-items:center; justify-content:space-between;
  padding:0 22px; font-size:12.5px; font-weight:600; flex:none; color:var(--app-ink);
  position:relative; z-index:11;
}
.phone-cap{text-align:center; font-size:12.5px; color:var(--muted); margin-top:12px; max-width:376px}
.phone-cap b{color:var(--text); font-weight:600; display:block; font-size:13px; margin-bottom:2px}

.t-hero{height:212px; background-size:cover; background-position:center; position:relative}
.t-hero .t-nav{position:absolute; top:0; left:0; right:0; padding:12px 15px; display:flex; align-items:center; gap:9px; background:linear-gradient(rgba(0,0,0,.42),transparent)}
.t-hero .t-nav .av{border:1.5px solid rgba(255,255,255,.8)}
.t-hero .t-nav b{color:#fff; font-size:13px; font-weight:600; text-shadow:0 1px 3px rgba(0,0,0,.4)}
.t-body{padding:16px 17px 22px}
.t-title{font-family:var(--display); font-size:20px; font-weight:700; letter-spacing:-.02em; line-height:1.25}
.t-dest{font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--app-teal); margin-top:8px}
.t-dates{font-size:13px; color:var(--app-muted); margin-top:5px}
.t-sec{margin-top:22px}
.t-sec h4{font-family:var(--display); font-size:14.5px; font-weight:700; margin-bottom:9px}
.t-sec p{margin:0; font-size:13.5px; line-height:1.6; color:var(--app-ink)}
.t-inc{display:grid; gap:7px; margin-top:4px}
.t-inc div{display:flex; gap:9px; font-size:13px; align-items:flex-start}
.t-inc b{font-size:11.5px; font-weight:700; letter-spacing:.04em; display:block}
.t-inc span{color:var(--app-muted); font-size:12.5px}
.t-pkg{
  border:1px solid var(--app-border); border-radius:12px; padding:12px; margin-bottom:8px;
  transition:border-color var(--t-fast) ease, background var(--t-fast) ease;
}
.t-pkg.on{border-color:var(--app-accent); background:var(--app-wait-bg)}
.t-pkg.off{opacity:.5}
.t-pkg-top{display:flex; align-items:center; gap:9px}
.t-pkg-top b{font-size:13.5px; font-weight:700; flex:1}
.t-pkg .price{font-family:var(--display); font-weight:700; font-size:15px; font-variant-numeric:tabular-nums}
.t-pkg .dep{font-size:11.5px; color:var(--app-muted); margin-top:2px; text-align:right}
.t-day{display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--app-hair)}
.t-day:last-child{border-bottom:0}
.t-day .n{
  width:26px; height:26px; border-radius:8px; background:var(--app-wait-bg); color:var(--app-wait);
  font-size:11px; font-weight:700; display:grid; place-items:center; flex:none;
}
.t-day b{font-size:13px; display:block; margin-bottom:3px}
.t-day p{font-size:12.5px; color:var(--app-muted); line-height:1.5}

.t-dock{
  border-top:1px solid var(--app-hair); background:#fff; padding:11px 16px 20px;
  display:flex; align-items:center; gap:13px; flex:none;
  box-shadow:0 -6px 18px rgba(0,0,0,.05);
}
.t-dock .p b{font-family:var(--display); font-size:19px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; display:block}
.t-dock .p span{font-size:11.5px; color:var(--app-muted)}
.t-cta{
  flex:1; padding:13px; border:0; border-radius:12px; background:var(--app-accent); color:#fff;
  font-size:14.5px; font-weight:700; font-family:var(--display);
  transition:transform var(--t-press) var(--ease-out), background var(--t-fast) ease;
}
.t-cta:hover{background:#04a7bb}
.t-cta:active{transform:scale(.97)}
.t-cta:disabled{background:var(--app-border); color:var(--app-muted)}
.t-cta-2{background:var(--app-teal)}
.t-cta-2:hover{background:#066f91}

.co-head{padding:14px 16px; border-bottom:1px solid var(--app-hair); display:flex; align-items:center; gap:11px; flex:none}
.co-head b{font-family:var(--display); font-size:15px; font-weight:700; flex:1}
.co-steps{display:flex; gap:4px; padding:11px 16px; flex:none; border-bottom:1px solid var(--app-hair)}
.co-steps i{flex:1; height:3px; border-radius:2px; background:var(--app-hair); transition:background 300ms var(--ease-out)}
.co-steps i.on{background:var(--app-accent)}
.co-steps i.done{background:var(--app-ok)}
.co-body{padding:17px}
.co-body h3{font-family:var(--display); font-size:17px; font-weight:700; margin-bottom:4px; letter-spacing:-.01em}
.co-body .lede{font-size:13px; color:var(--app-muted); margin:0 0 16px; line-height:1.5}
.co-f{margin-bottom:13px}
.co-f label{font-size:12px; font-weight:600; display:block; margin-bottom:5px}
.co-f label .star{color:var(--app-danger)}
.co-f input,.co-f select,.co-f textarea{
  width:100%; padding:11px 12px; border:1px solid var(--app-border); border-radius:10px;
  font:inherit; font-size:13.5px; background:#fff; color:var(--app-ink);
}
.co-f input:focus,.co-f select:focus{outline:0; border-color:var(--app-accent); box-shadow:0 0 0 3px rgba(5,188,211,.14)}
.co-opt{
  display:flex; align-items:flex-start; gap:10px; padding:12px; border:1px solid var(--app-border);
  border-radius:11px; margin-bottom:8px; cursor:pointer;
  transition:border-color var(--t-fast) ease, background var(--t-fast) ease;
}
.co-opt.on{border-color:var(--app-accent); background:var(--app-wait-bg)}
.co-opt input{accent-color:var(--app-teal); margin:2px 0 0}
.co-opt b{font-size:13.5px; display:block}
.co-opt .d{font-size:12px; color:var(--app-muted); margin-top:3px; line-height:1.5}
.co-sched{margin-top:9px; border-top:1px dashed var(--app-border); padding-top:9px; display:grid; gap:6px}
.co-sched div{display:flex; justify-content:space-between; font-size:12px; color:var(--app-muted)}
.co-sched div b{color:var(--app-ink); font-variant-numeric:tabular-nums; font-weight:600}
.co-sum{background:var(--app-hair); border-radius:12px; padding:13px; margin-top:4px}
.co-sum .r{display:flex; justify-content:space-between; font-size:13px; padding:4px 0}
.co-sum .r span{color:var(--app-muted)}
.co-sum .r b{font-variant-numeric:tabular-nums; font-weight:600}
.co-sum .tot{border-top:1px solid var(--app-border); margin-top:7px; padding-top:9px}
.co-sum .tot b{font-family:var(--display); font-size:16px; font-weight:700}
.co-legal{font-size:11.5px; color:var(--app-muted); line-height:1.5; margin:13px 0 0; text-align:center}
.co-legal a{color:var(--app-teal); font-weight:600}
.co-secure{display:flex; align-items:center; justify-content:center; gap:6px; font-size:11.5px; color:var(--app-muted); margin-bottom:11px}

.mb-card{border:1px solid var(--app-border); border-radius:12px; padding:13px; margin-bottom:10px}
.mb-card h4{font-family:var(--display); font-size:13.5px; font-weight:700; margin-bottom:9px; display:flex; align-items:center; gap:8px}
.mb-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--app-hair); font-size:13px}
.mb-row:last-child{border-bottom:0}
.mb-row .g{flex:1; min-width:0}
.mb-row b{font-variant-numeric:tabular-nums; font-weight:600}
.mb-row .s{font-size:11.5px; color:var(--app-muted); margin-top:1px}
.t-pill{
  display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:999px;
  font-size:11px; font-weight:700; background:var(--app-hair); color:var(--app-muted); white-space:nowrap;
}
.t-pill.ok{background:var(--app-ok-bg); color:var(--app-ok)}
.t-pill.warn{background:var(--app-warn-bg); color:var(--app-warn)}
.t-pill.bad{background:var(--app-danger-bg); color:var(--app-danger)}
.t-pill.wait{background:var(--app-wait-bg); color:var(--app-wait)}
.t-banner{
  background:linear-gradient(135deg,var(--app-teal),var(--app-accent)); color:#fff;
  border-radius:14px; padding:15px; margin-bottom:14px;
}
.t-banner h4{font-family:var(--display); font-size:15px; font-weight:700; margin-bottom:3px}
.t-banner p{font-size:12.5px; opacity:.92; margin:0 0 11px}
.t-task{display:flex; align-items:center; gap:9px; padding:8px 10px; background:rgba(255,255,255,.16); border-radius:9px; margin-bottom:6px; font-size:12.5px; font-weight:600}
.t-task:last-child{margin-bottom:0}
.t-task .t-pill{background:rgba(255,255,255,.25); color:#fff; margin-left:auto}

.note{
  border-left:3px solid var(--cyan); background:var(--cyan-tint); padding:11px 14px;
  border-radius:0 var(--r-sm) var(--r-sm) 0; font-size:12.5px; color:var(--text-2); margin-bottom:16px;
}
.note b{color:var(--cyan-dark)}
.note code{font-family:var(--mono); font-size:11.5px; background:rgba(255,255,255,.7); padding:1px 5px; border-radius:4px}
</style>
