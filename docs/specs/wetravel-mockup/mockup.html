<title>Uluwatu Surf Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap">
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Tokens. Lifted verbatim from the Swellyo repo:
   operator-dashboard/src/styles/tokens.css  (desktop chrome)
   src/components/trips/dashboard/dashboardTheme.ts + src/styles/theme.ts (phone)

   Bright mode only, on purpose — that is the operator dashboard's own stated
   decision ("a work tool used in daylight"), and the repo defines no dark
   values to borrow. Every colour is therefore painted explicitly so the page
   holds on either host ground.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#ffffff; --panel:#f7f7f5; --panel-2:#f0f0ec;
  --line:#e3e3de; --line-strong:#d4d4cd;
  --text:#1c1c1a; --text-2:#3a3a36; --muted:#6b6b66;
  --cyan:#05bcd3; --cyan-dark:#066b8c; --cyan-tint:#e6f4f8;
  --ok:#1f7a4d; --ok-bg:#e8f5ee;
  --warn:#b8532b; --warn-bg:#fdf0e9;
  --danger:#b3261e; --danger-bg:#fdecea;
  --wait:#5b5bb0; --wait-bg:#eeeefb;

  /* phone frame — the app's own palette, which has genuinely drifted from the
     dashboard's. Kept apart here exactly as the two real products keep it. */
  --app-accent:#05BCD3; --app-teal:#0788B0; --app-ink:#222B30;
  --app-muted:#7B7B7B; --app-hair:#EEEEEE; --app-border:#E4E4E4;
  --app-ok:#1F8A4C; --app-ok-bg:#EAF7EF;
  --app-warn:#8A6100; --app-warn-bg:#FDF3DC;
  --app-danger:#C4361E; --app-danger-bg:#FCEEF0;
  --app-wait:#066B8C; --app-wait-bg:#E4F8FB;

  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --display:'Montserrat','Inter',-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;

  --r-sm:6px; --r:10px; --r-lg:14px;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --t-press:140ms; --t-fast:160ms; --t-panel:200ms;
  --shadow-sm:0 1px 2px rgba(28,28,26,.06);
  --shadow:0 4px 16px rgba(28,28,26,.08);
  --shadow-lg:0 12px 40px rgba(28,28,26,.16);
  --rail:236px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--panel); color:var(--text);
  font-family:var(--font); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--display); margin:0; text-wrap:balance; color:var(--text)}
button{font:inherit; color:inherit; cursor:pointer}
a{color:var(--cyan-dark)}
:focus-visible{outline:2px solid var(--cyan); outline-offset:2px; border-radius:4px}
.tnum{font-variant-numeric:tabular-nums}

/* ── App shell ─────────────────────────────────────────────────────────── */
.app{display:grid; grid-template-columns:var(--rail) 1fr; min-height:100vh}

.rail{
  background:var(--bg); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.rail-top{padding:16px 14px 8px; display:flex; align-items:center; justify-content:space-between}
.mark{display:flex; align-items:center; gap:9px; font-family:var(--display); font-weight:700; font-size:14px; letter-spacing:-.01em}
.mark-badge{
  width:28px; height:28px; border-radius:8px; display:grid; place-items:center;
  background:linear-gradient(150deg,var(--cyan),var(--cyan-dark)); color:#fff; flex:none;
}
.rail-scroll{flex:1; overflow-y:auto; padding:6px 10px 14px}
.create{
  width:calc(100% - 20px); margin:4px 10px 12px; padding:9px 12px; border:0;
  border-radius:var(--r); background:var(--cyan-dark); color:#fff;
  font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:8px;
  justify-content:center; transition:transform var(--t-press) var(--ease-out), background var(--t-fast) ease;
}
.create:hover{background:#055c78}
.create:active{transform:scale(.97)}

.nav-item{
  display:flex; align-items:center; gap:10px; width:100%; padding:7px 10px;
  border:0; background:none; border-radius:var(--r-sm); color:var(--text-2);
  font-size:13.5px; font-weight:500; text-align:left;
  transition:background var(--t-fast) ease, color var(--t-fast) ease;
}
.nav-item:hover{background:var(--panel)}
.nav-item[aria-current="page"]{background:var(--cyan-tint); color:var(--cyan-dark); font-weight:600}
.nav-item .chev{margin-left:auto; transition:transform var(--t-fast) var(--ease-out); opacity:.5}
.nav-item[aria-expanded="true"] .chev{transform:rotate(90deg)}
.nav-sub{display:grid; gap:1px; padding:2px 0 6px 0; margin-left:16px; border-left:1px solid var(--line)}
.nav-sub .nav-item{padding-left:16px; font-size:13px; border-radius:0 var(--r-sm) var(--r-sm) 0}
.count{
  margin-left:auto; min-width:19px; height:19px; padding:0 5px; border-radius:999px;
  background:var(--panel-2); color:var(--muted); font-size:11px; font-weight:600;
  display:grid; place-items:center;
}
.nav-item[aria-current="page"] .count{background:var(--cyan); color:#fff}
.rail-foot{border-top:1px solid var(--line); padding:11px 14px; display:flex; align-items:center; gap:9px}

/* ── Main ──────────────────────────────────────────────────────────────── */
.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:30; background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--line);
  padding:0 26px; height:56px; display:flex; align-items:center; gap:14px;
}
.crumb{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); min-width:0}
.crumb b{color:var(--text); font-weight:600}
.crumb .sep{opacity:.4}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:8px}
.view{padding:24px 26px 60px; max-width:1240px; width:100%}
.view-head{display:flex; align-items:flex-start; gap:16px; margin-bottom:18px; flex-wrap:wrap}
.view-head h1{font-size:23px; font-weight:700; letter-spacing:-.02em}
.view-head p{margin:5px 0 0; color:var(--muted); font-size:13.5px; max-width:64ch}
.view-head .spacer{margin-left:auto}

/* ── Primitives ────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:8px 13px;
  border:1px solid var(--line-strong); background:var(--bg); color:var(--text);
  border-radius:var(--r-sm); font-size:13px; font-weight:600; white-space:nowrap;
  transition:transform var(--t-press) var(--ease-out), background var(--t-fast) ease, border-color var(--t-fast) ease;
}
.btn:hover{background:var(--panel); border-color:var(--muted)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--cyan-dark); border-color:var(--cyan-dark); color:#fff}
.btn-primary:hover{background:#055c78; border-color:#055c78}
.btn-ghost{border-color:transparent; background:none}
.btn-ghost:hover{background:var(--panel-2); border-color:transparent}
.btn-sm{padding:5px 9px; font-size:12.5px}
.btn-danger{color:var(--danger); border-color:#e9c9c6}
.btn-danger:hover{background:var(--danger-bg); border-color:var(--danger)}
.btn:disabled{opacity:.45; pointer-events:none}

.card{background:var(--bg); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-sm)}
.card-pad{padding:18px}
.card-head{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px}
.card-head h3{font-size:14.5px; font-weight:600}
.card-head .spacer{margin-left:auto}

.pill{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px;
  font-size:11.5px; font-weight:600; letter-spacing:.01em; white-space:nowrap;
  background:var(--panel-2); color:var(--muted);
}
.pill-ok{background:var(--ok-bg); color:var(--ok)}
.pill-warn{background:var(--warn-bg); color:var(--warn)}
.pill-danger{background:var(--danger-bg); color:var(--danger)}
.pill-wait{background:var(--wait-bg); color:var(--wait)}
.pill-accent{background:var(--cyan-tint); color:var(--cyan-dark)}
.dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto}
.tab{
  position:relative; padding:9px 13px; border:0; background:none; color:var(--muted);
  font-size:13.5px; font-weight:600; white-space:nowrap;
  transition:color var(--t-fast) ease;
}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--cyan-dark)}
.tab[aria-selected="true"]::after{
  content:''; position:absolute; left:9px; right:9px; bottom:-1px; height:2px;
  background:var(--cyan); border-radius:2px 2px 0 0;
}
.tab .count{display:inline-grid; margin-left:6px; vertical-align:middle}
.tab[aria-selected="true"] .count{background:var(--cyan); color:#fff}

.tbl-wrap{overflow-x:auto; border-radius:var(--r-lg)}
table{width:100%; border-collapse:collapse; font-size:13px}
th{
  text-align:left; padding:9px 13px; background:var(--panel); color:var(--muted);
  font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em;
  white-space:nowrap; border-bottom:1px solid var(--line); position:sticky; top:0;
}
td{padding:11px 13px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr{transition:background var(--t-fast) ease}
tbody tr:hover{background:var(--panel)}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right; font-variant-numeric:tabular-nums}
.linky{color:var(--cyan-dark); font-weight:600; background:none; border:0; padding:0; text-align:left}
.linky:hover{text-decoration:underline}

.stat{padding:14px 16px}
.stat-l{font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); display:flex; align-items:center; gap:5px}
.stat-v{font-family:var(--display); font-size:24px; font-weight:700; letter-spacing:-.02em; margin-top:5px; font-variant-numeric:tabular-nums}
.stat-s{font-size:12px; color:var(--muted); margin-top:2px}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:16px}
@media (max-width:1080px){.grid-4{grid-template-columns:repeat(2,1fr)} .grid-3,.grid-2{grid-template-columns:1fr}}

.field{display:grid; gap:5px; margin-bottom:13px}
.field label{font-size:12.5px; font-weight:600; color:var(--text-2)}
.field .hint{font-size:12px; color:var(--muted)}
input[type=text],input[type=email],input[type=number],input[type=date],select,textarea{
  width:100%; padding:8px 11px; border:1px solid var(--line-strong); border-radius:var(--r-sm);
  background:var(--bg); color:var(--text); font:inherit; font-size:13.5px;
  transition:border-color var(--t-fast) ease, box-shadow var(--t-fast) ease;
}
input:focus,select:focus,textarea:focus{
  outline:0; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(5,188,211,.15);
}
.money-in{position:relative}
.money-in span{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px}
.money-in input{padding-left:24px; font-variant-numeric:tabular-nums}

.switch{display:flex; align-items:flex-start; gap:9px; padding:9px 0; cursor:pointer}
.switch input{appearance:none; margin:2px 0 0; width:34px; height:20px; border-radius:999px; background:var(--line-strong); position:relative; flex:none; transition:background var(--t-fast) ease; cursor:pointer}
.switch input::after{content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:var(--shadow-sm); transition:transform var(--t-fast) var(--ease-out)}
.switch input:checked{background:var(--cyan)}
.switch input:checked::after{transform:translateX(14px)}
.switch .sw-l{font-size:13px; font-weight:600}
.switch .sw-d{font-size:12.5px; color:var(--muted); margin-top:1px}

.radio-row{display:flex; align-items:center; gap:8px; padding:8px 11px; border:1px solid var(--line); border-radius:var(--r-sm); cursor:pointer; transition:border-color var(--t-fast) ease, background var(--t-fast) ease}
.radio-row:hover{background:var(--panel)}
.radio-row.on{border-color:var(--cyan); background:var(--cyan-tint)}
.radio-row input{accent-color:var(--cyan-dark); margin:0}

.empty{padding:44px 20px; text-align:center; color:var(--muted)}
.empty h4{font-size:15px; color:var(--text); margin-bottom:5px}
.empty p{margin:0 auto; max-width:44ch; font-size:13px}

/* ── Modal ─────────────────────────────────────────────────────────────── */
.scrim{
  position:fixed; inset:0; z-index:100; background:rgba(28,28,26,.42);
  display:grid; place-items:center; padding:24px;
  animation:scrim-in 180ms var(--ease-out);
}
@keyframes scrim-in{from{opacity:0}}
.modal{
  background:var(--bg); border-radius:var(--r-lg); box-shadow:var(--shadow-lg);
  width:min(620px,100%); max-height:86vh; display:flex; flex-direction:column;
  transform-origin:center; animation:modal-in 200ms var(--ease-out);
}
@keyframes modal-in{from{opacity:0; transform:scale(.96) translateY(6px)}}
.modal-head{padding:18px 20px 12px; display:flex; align-items:flex-start; gap:12px; border-bottom:1px solid var(--line)}
.modal-head h3{font-size:17px; font-weight:700; letter-spacing:-.01em}
.modal-head p{margin:4px 0 0; font-size:13px; color:var(--muted)}
.modal-body{padding:18px 20px; overflow-y:auto}
.modal-foot{padding:13px 20px; border-top:1px solid var(--line); display:flex; align-items:center; gap:9px; background:var(--panel)}
.modal-foot .spacer{margin-left:auto}
.x{width:30px; height:30px; border-radius:var(--r-sm); border:0; background:none; color:var(--muted); font-size:19px; line-height:1; display:grid; place-items:center; margin-left:auto; flex:none; transition:background var(--t-fast) ease}
.x:hover{background:var(--panel-2); color:var(--text)}

/* ── Toast ─────────────────────────────────────────────────────────────── */
.toasts{position:fixed; right:20px; bottom:20px; z-index:200; display:flex; flex-direction:column-reverse; gap:8px}
.toast{
  background:var(--text); color:#fff; padding:11px 15px; border-radius:var(--r);
  font-size:13px; font-weight:500; box-shadow:var(--shadow-lg); max-width:340px;
  transition:opacity 200ms var(--ease-out), transform 200ms var(--ease-out);
}
@starting-style{.toast{opacity:0; transform:translateY(10px) scale(.97)}}
.toast.out{opacity:0; transform:translateY(6px) scale(.97)}
.toast b{color:var(--cyan)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>
<style>
/* ── Trip list ─────────────────────────────────────────────────────────── */
.toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.search{position:relative; flex:1; min-width:220px; max-width:420px}
.search input{padding-left:32px}
.search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted)}
.seg{display:inline-flex; background:var(--panel-2); border-radius:var(--r-sm); padding:2px; gap:2px}
.seg button{padding:5px 11px; border:0; background:none; border-radius:4px; font-size:12.5px; font-weight:600; color:var(--muted); transition:background var(--t-fast) ease, color var(--t-fast) ease}
.seg button[aria-pressed="true"]{background:var(--bg); color:var(--text); box-shadow:var(--shadow-sm)}

.trip-row{
  display:grid; grid-template-columns:132px 1fr auto; gap:16px; align-items:center;
  padding:13px; background:var(--bg); border:1px solid var(--line); border-radius:var(--r-lg);
  margin-bottom:10px; box-shadow:var(--shadow-sm);
  transition:border-color var(--t-fast) ease, box-shadow var(--t-fast) ease, transform var(--t-fast) var(--ease-out);
}
.trip-row:hover{border-color:var(--line-strong); box-shadow:var(--shadow); transform:translateY(-1px)}
.trip-thumb{
  width:132px; height:96px; border-radius:var(--r); background-size:cover; background-position:center;
  position:relative; overflow:hidden; flex:none;
}
.trip-meta h3{font-size:16px; font-weight:700; letter-spacing:-.01em; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.trip-facts{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:7px; font-size:12.5px; color:var(--muted)}
.trip-facts span{display:inline-flex; align-items:center; gap:5px}
.trip-money{display:flex; align-items:center; gap:20px; margin-top:9px; font-size:12.5px}
.trip-money b{font-family:var(--display); font-size:14px; font-variant-numeric:tabular-nums; display:block; margin-top:1px}
.trip-money .l{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:600}
.trip-act{display:flex; flex-direction:column; align-items:flex-end; gap:9px}
.icon-btn{width:30px; height:30px; border-radius:var(--r-sm); border:1px solid transparent; background:none; color:var(--muted); display:grid; place-items:center; transition:background var(--t-fast) ease, color var(--t-fast) ease}
.icon-btn:hover{background:var(--panel-2); color:var(--text)}

.fill{height:5px; border-radius:999px; background:var(--panel-2); overflow:hidden; min-width:96px}
.fill i{display:block; height:100%; background:var(--cyan); border-radius:999px; transition:width 400ms var(--ease-out)}
.fill i.hot{background:var(--warn)}

/* ── Trip header ───────────────────────────────────────────────────────── */
.trip-head{display:grid; grid-template-columns:172px 1fr auto; gap:20px; align-items:start; margin-bottom:18px}
.trip-head .trip-thumb{width:172px; height:118px}
.trip-head h1{font-size:22px; font-weight:700; letter-spacing:-.02em}
.trip-head .sub{color:var(--muted); font-size:13.5px; margin-top:5px; display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.headstats{border-left:1px solid var(--line); padding-left:20px; display:grid; gap:6px; min-width:230px}
.headstat{display:flex; align-items:baseline; gap:12px; font-size:13px}
.headstat .l{color:var(--muted); flex:1; display:flex; align-items:center; gap:5px}
.headstat .v{font-family:var(--display); font-weight:700; font-variant-numeric:tabular-nums; font-size:14.5px}

.q{width:14px; height:14px; border-radius:50%; border:1px solid var(--line-strong); color:var(--muted); font-size:9px; display:inline-grid; place-items:center; cursor:help; flex:none; background:none; font-weight:700}
.q:hover{border-color:var(--cyan); color:var(--cyan-dark)}

/* ── Builder ───────────────────────────────────────────────────────────── */
.builder{display:grid; grid-template-columns:196px 1fr; gap:22px; align-items:start}
.builder-nav{display:grid; gap:1px; position:sticky; top:74px}
.builder-nav button{
  display:flex; align-items:center; gap:10px; padding:9px 11px; border:0; background:none;
  border-radius:var(--r-sm); font-size:13px; font-weight:600; color:var(--muted); text-align:left;
  transition:background var(--t-fast) ease, color var(--t-fast) ease;
}
.builder-nav button:hover{background:var(--panel-2); color:var(--text)}
.builder-nav button[aria-current="step"]{background:var(--cyan-tint); color:var(--cyan-dark)}
.step-n{width:20px; height:20px; border-radius:50%; border:1px solid currentColor; font-size:10.5px; display:grid; place-items:center; flex:none; opacity:.65}
.builder-nav button[aria-current="step"] .step-n{background:var(--cyan-dark); color:#fff; border-color:var(--cyan-dark); opacity:1}
.done .step-n{background:var(--ok); border-color:var(--ok); color:#fff; opacity:1}

.pkg{border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:10px; background:var(--bg)}
.pkg-top{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.pkg-top h4{font-size:14.5px; font-weight:700}
.pkg-plan{
  margin-top:11px; padding:10px 12px; border-radius:var(--r-sm); background:var(--panel);
  border:1px dashed var(--line-strong); display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  font-size:12.5px;
}
.pkg-plan b{font-variant-numeric:tabular-nums}

.numgrid{display:grid; grid-template-columns:repeat(6,1fr); border:1px solid var(--line-strong); border-radius:var(--r-sm); overflow:hidden}
.numgrid button{
  padding:9px 0; border:0; border-right:1px solid var(--line); border-bottom:1px solid var(--line);
  background:var(--bg); font-size:13px; font-weight:600; color:var(--text-2);
  transition:background var(--t-fast) ease, color var(--t-fast) ease;
}
.numgrid button:nth-child(6n){border-right:0}
.numgrid button:nth-last-child(-n+6){border-bottom:0}
.numgrid button:hover{background:var(--cyan-tint)}
.numgrid button[aria-pressed="true"]{background:var(--cyan); color:#fff}

.sched-row{display:grid; grid-template-columns:1fr 150px 128px; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line)}
.sched-row:last-child{border-bottom:0}
.sched-row .lbl{font-size:13px; font-weight:600}
.sched-row .fixed{font-size:13px; color:var(--muted)}

/* Live "today" for the demo world. Fixed so the story stays stable. */
const TODAY = new Date('2026-08-25T09:00:00Z');

/* Normalise every unpaid installment's status from its own date, so a row can
   never claim it is "due now" while its date sits ten days in the past. Paid,
   failed and deposit rows are left exactly as authored. */
function normaliseSchedules(){
  DB.bookings.forEach(b => b.sched.forEach(r => {
    if(r.status === 'paid' || r.status === 'failed' || r.due === 'booking') return;
    const n = Math.round((new Date(r.due+'T00:00:00Z') - TODAY) / 86400000);
    r.status = n < 0 ? 'pastdue' : n <= 14 ? 'due' : 'scheduled';
  }));
}
normaliseSchedules();

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const trip    = id => DB.trips.find(t=>t.id===id);
const pkgOf   = (t,id) => t.packages.find(p=>p.id===id);
const contact = id => DB.contacts.find(c=>c.id===id);
const bookingsOf = id => DB.bookings.filter(b=>b.trip===id);

function money(n, cur='USD', dp=2){
  const c = CUR[cur] || CUR.USD;
  return c.s + Number(n).toLocaleString('en-US',{minimumFractionDigits:dp, maximumFractionDigits:dp});
}
const money0 = (n,cur) => money(n,cur,0);

function fmtDate(d){
  if(!d || d==='booking') return 'Due at booking';
  return new Date(d+'T00:00:00Z').toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric', timeZone:'UTC'});
}
function fmtShort(d){
  return new Date(d+'T00:00:00Z').toLocaleDateString('en-US',{month:'short', day:'numeric', timeZone:'UTC'});
}
function fmtRange(a,b){
  const A=new Date(a+'T00:00:00Z'), B=new Date(b+'T00:00:00Z');
  const m=d=>d.toLocaleDateString('en-US',{month:'short',timeZone:'UTC'}), n=d=>d.getUTCDate();
  return m(A)===m(B) ? `${m(A)} ${n(A)}–${n(B)}, ${B.getUTCFullYear()}`
                     : `${m(A)} ${n(A)} – ${m(B)} ${n(B)}, ${B.getUTCFullYear()}`;
}
function daysFrom(d){
  if(!d || d==='booking') return 0;
  return Math.round((new Date(d+'T00:00:00Z') - TODAY) / 86400000);
}
function relDays(d){
  const n = daysFrom(d);
  if(n === 0)  return 'today';
  if(n === 1)  return 'tomorrow';
  if(n > 0)    return `in ${n} days`;
  if(n === -1) return '1 day ago';
  return `${-n} days ago`;
}
const initials = n => n.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

/* ── Booking money ─────────────────────────────────────────────────────── */
function bookingTotal(b){
  const t = trip(b.trip), p = pkgOf(t, b.pkg);
  const base = (p ? p.price : 0) * b.qty;
  const add  = (b.addons||[]).reduce((s,id)=>{
    const a = t.addons.find(x=>x.id===id);
    return s + (a ? a.price * b.qty : 0);
  },0);
  return base + add;
}
const bookingPaid    = b => b.sched.filter(r=>r.status==='paid').reduce((s,r)=>s+r.amount,0);
const bookingBalance = b => bookingTotal(b) - bookingPaid(b);
const bookingPastDue = b => b.sched.filter(r=>r.status==='pastdue').reduce((s,r)=>s+r.amount,0);
const bookingDueNow  = b => b.sched.filter(r=>r.status==='due'||r.status==='pastdue').reduce((s,r)=>s+r.amount,0);
const bookingLater   = b => b.sched.filter(r=>r.status==='scheduled').reduce((s,r)=>s+r.amount,0);
const bookingFailed  = b => b.sched.filter(r=>r.status==='failed').reduce((s,r)=>s+r.amount,0);
const headcount      = b => b.participants.length;

function bookingStatus(b){
  if(bookingFailed(b))            return { k:'danger', t:'Payment failed' };
  if(bookingPastDue(b))           return { k:'danger', t:'Past due' };
  if(bookingBalance(b) === 0)     return { k:'ok',     t:'Paid in full' };
  if(b.sched.some(r=>r.status==='due')) return { k:'warn', t:'Due now' };
  return { k:'wait', t:'On plan' };
}

/* ── Trip roll-ups ─────────────────────────────────────────────────────── */
function tripStats(t){
  const bs = bookingsOf(t.id);
  const s = {
    bookings: bs.length,
    going: bs.reduce((n,b)=>n+headcount(b),0),
    cap: t.cap,
    expected: bs.reduce((n,b)=>n+bookingTotal(b),0),
    paid: bs.reduce((n,b)=>n+bookingPaid(b),0),
    pastDue: bs.reduce((n,b)=>n+bookingPastDue(b),0),
    dueNow: bs.reduce((n,b)=>n+bookingDueNow(b),0),
    later: bs.reduce((n,b)=>n+bookingLater(b),0),
    failed: bs.reduce((n,b)=>n+bookingFailed(b),0),
  };
  s.balance = s.expected - s.paid;
  /* paperwork */
  const ps = bs.flatMap(b=>b.participants);
  s.people = ps.length;
  s.signed = ps.filter(p=>p.signed).length;
  s.unsigned = s.people - s.signed;
  s.checkoutDone = ps.filter(p=>questionsComplete(t,p)).length;
  s.tasksDone = ps.filter(p=>tasksComplete(t,p)).length;
  return s;
}

function questionsComplete(t,p){
  return t.questions.filter(q=>q.req).every(q => (p.answers?.[q.id]||'').trim() !== '');
}
function tasksComplete(t,p){
  const req = t.tasks.flatMap(tk=>tk.questions.filter(q=>q.req));
  if(!req.length) return true;
  return req.every(q => (p.task?.[q.id]||'').trim() !== '');
}

/* ── Fees ──────────────────────────────────────────────────────────────── */
function platformFee(amount){
  return Math.max(DB.settings.platformFeeMin, amount * DB.settings.platformFeePct / 100);
}
function processingFee(amount, cur, method='card'){
  const f = FEES[cur] || FEES.USD;
  if(method === 'bank') return 0;
  if(method === 'wire') return f.wire;
  return amount * (f[method] ?? f.card) / 100;
}
/* What the traveller is asked to pay on top, given the "Who pays the fees?" setting */
function travellerAddOn(amount, cur, method){
  let add = 0;
  if(DB.settings.wtFeePaidBy === 'participant')      add += platformFee(amount);
  if(DB.settings.paymentFeesPaidBy === 'participant') add += processingFee(amount, cur, method);
  return Math.round(add*100)/100;
}

/* ── Portfolio roll-up ─────────────────────────────────────────────────── */
function portfolio(cur='USD'){
  const ts = DB.trips.filter(t=>t.cur===cur && t.status!=='draft');
  const acc = { expected:0, paid:0, pastDue:0, dueNow:0, later:0, failed:0, going:0, unsigned:0, incomplete:0 };
  ts.forEach(t=>{
    const s = tripStats(t);
    acc.expected+=s.expected; acc.paid+=s.paid; acc.pastDue+=s.pastDue;
    acc.dueNow+=s.dueNow; acc.later+=s.later; acc.failed+=s.failed;
    acc.going+=s.going; acc.unsigned+=s.unsigned;
    acc.incomplete += s.people - s.checkoutDone;
  });
  acc.balance = acc.expected - acc.paid;
  return acc;
}

/* Upcoming payments, bucketed by month — the one forward-looking view */
function upcomingByMonth(cur='USD'){
  const buckets = new Map();
  DB.bookings.forEach(b=>{
    const t = trip(b.trip);
    if(t.cur !== cur) return;
    b.sched.forEach(r=>{
      if(r.status==='paid' || r.due==='booking') return;
      const key = r.due.slice(0,7);
      if(!buckets.has(key)) buckets.set(key,{due:0,past:0});
      const bk = buckets.get(key);
      if(r.status==='pastdue') bk.past += r.amount; else bk.due += r.amount;
    });
  });
  return [...buckets.entries()].sort((a,b)=>a[0]<b[0]?-1:1)
    .map(([k,v])=>({ month:k, label:new Date(k+'-01T00:00:00Z').toLocaleDateString('en-US',{month:'short',timeZone:'UTC'}), ...v }));
}

/* Ledger — synthesised from every paid row plus the recorded payouts */
function ledger(cur='USD'){
  const rows = [];
  DB.bookings.forEach(b=>{
    const t = trip(b.trip);
    if(t.cur !== cur) return;
    b.sched.forEach((r,i)=>{
      if(r.status !== 'paid') return;
      const pf = processingFee(r.amount, cur, r.method||'card');
      const wf = platformFee(r.amount);
      rows.push({
        date:r.paidOn, type:'Payment', method:r.method||'card', amount:r.amount,
        fee: DB.settings.paymentFeesPaidBy==='organizer' ? pf : 0,
        wt:  DB.settings.wtFeePaidBy==='organizer' ? wf : 0,
        desc:`${b.buyer} — ${t.name}`, cur, id:`${b.id}-${i}`,
      });
      if(r.status==='failed') rows.push({date:r.failedOn,type:'Failed',method:r.method||'card',amount:0,fee:0,wt:0,desc:`${b.buyer} — declined`,cur,id:`${b.id}-f${i}`});
    });
  });
  DB.payouts.filter(p=>p.cur===cur).forEach(p=>{
    rows.push({ date:p.date, type:p.kind, method:'', amount:-p.amount, fee:p.fee, wt:0, desc:p.to, cur, id:p.id });
  });
  return rows.sort((a,b)=> a.date<b.date ? 1 : -1);
}

  el.className='toast'; el.innerHTML = html;
  host.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 220); }, 3400);
}

let modalEl = null;
function openModal(html){
  closeModal();
  modalEl = document.createElement('div');
  modalEl.className = 'scrim';
  modalEl.innerHTML = html;
  modalEl.addEventListener('mousedown', e=>{ if(e.target===modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  document.addEventListener('keydown', escClose);
  const f = modalEl.querySelector('input,select,textarea,button');
  if(f) f.focus();
}
function closeModal(){
  if(modalEl){ modalEl.remove(); modalEl = null; document.removeEventListener('keydown', escClose); }
}
function escClose(e){ if(e.key==='Escape') closeModal(); }

function go(view, opts={}){
  Object.assign(S, {view}, opts);
  render();
  window.scrollTo({top:0, behavior:'instant'});
}

function topbar(crumbs, right=''){
  return `<div class="topbar">
    <div class="crumb">${crumbs.map((c,i)=>
      (i?'<span class="sep">/</span>':'') + (c.go
        ? `<button class="linky" style="font-weight:500;color:var(--muted)" onclick="${c.go}">${esc(c.t)}</button>`

function statCard(label, value, sub, tone='', tip=''){
  return `<div class="card stat">
    <div class="stat-l">${esc(label)}${tip?`<button class="q" title="${esc(tip)}">?</button>`:''}</div>
    <div class="stat-v" ${tone?`style="color:${tone}"`:''}>${value}</div>
    ${sub?`<div class="stat-s">${sub}</div>`:''}
  </div>`;
}

function render(){
  const app = $('#app');
  const body = S.view==='traveller' ? viewTraveller() : viewFor(S.view);
  app.innerHTML = S.view==='traveller'
    ? `<div class="main">${body}</div>`
    : `${shell()}<div class="main">${body}</div>`;
  app.style.gridTemplateColumns = S.view==='traveller' ? '1fr' : 'var(--rail) 1fr';
}

function viewFor(v){
  switch(v){
    case 'trips': case 'past': case 'draft': case 'archived':
    case 'deactivated': case 'joined': return viewTrips(v);
    case 'trip':       return viewTrip();
    case 'builder':    return viewBuilder();
    case 'crm':        return viewCRM();
    case 'contact':    return viewContact();
    case 'payments':   return viewPayments();
    case 'reports':    return viewReports();
    case 'inventory':  return viewInventory();
    case 'network':    return viewNetwork();
    case 'settings':   return viewSettings();
    case 'itineraries':return viewItineraries();
    default:           return viewTrips('trips');
  }
}

function viewTrips(filter){
  const map = { trips:'upcoming', past:'past', draft:'draft', archived:'archived',
                deactivated:'deactivated', joined:'joined' };
  const want = map[filter] || 'upcoming';
  const title = { upcoming:'Upcoming Trips', past:'Past Trips', draft:'Draft Trips',
                  archived:'Archived Trips', deactivated:'Deactivated Trips', joined:'Trips I Joined' }[want];
  const list = DB.trips.filter(t=>t.status===want);
  const p = portfolio(S.cur);
  const nCur = DB.trips.filter(t=>t.status==='upcoming' && t.cur===S.cur).length;

  const rows = list.length ? list.map(t=>{
    const s = tripStats(t);
    const pct = Math.round(s.going / t.cap * 100);
    const flags = [];
    if(s.pastDue) flags.push(`<span class="pill pill-danger"><span class="dot"></span>${money0(s.pastDue,t.cur)} past due</span>`);
    if(s.failed)  flags.push(`<span class="pill pill-danger">${ICON.warn} Payment failed</span>`);
    if(s.unsigned)flags.push(`<span class="pill pill-warn">${s.unsigned} unsigned</span>`);
    return `<div class="trip-row">
      <div class="trip-thumb" style="background:${t.art}"></div>
      <div class="trip-meta">
        <h3>${esc(t.name)} ${t.tags.map(g=>`<span class="pill pill-accent">${esc(g)}</span>`).join('')}</h3>
        <div class="trip-facts">
          <span>${ICON.cal}${fmtRange(t.start,t.end)}</span>
          <span>${ICON.pin}${esc(t.dest)}</span>
          <span>${ICON.users}${s.going}/${t.cap} going</span>
          <span style="font-family:var(--mono);font-size:11.5px">${esc(t.tripId)}</span>
        </div>
        <div class="trip-money">
          <div><span class="l">Expected</span><b>${money0(s.expected,t.cur)}</b></div>
          <div><span class="l">Collected</span><b style="color:var(--ok)">${money0(s.paid,t.cur)}</b></div>
          <div><span class="l">Outstanding</span><b style="color:${s.pastDue?'var(--danger)':'var(--text)'}">${money0(s.balance,t.cur)}</b></div>
          <div style="flex:1;min-width:110px"><span class="l">Filled</span>
            <div class="fill" style="margin-top:6px"><i class="${pct>85?'hot':''}" style="width:${pct}%"></i></div></div>
        </div>
        ${flags.length?`<div style="display:flex;gap:6px;margin-top:9px;flex-wrap:wrap">${flags.join('')}</div>`:''}
      </div>
      <div class="trip-act">
        <div style="display:flex;gap:2px">
          <button class="icon-btn" title="Edit trip" onclick="go('builder',{tripId:'${t.id}'})">${ICON.edit}</button>
          <button class="icon-btn" title="View public page" onclick="go('traveller')">${ICON.eye}</button>
          <button class="icon-btn" title="More">${ICON.dots}</button>
        </div>
        <button class="btn btn-primary" onclick="go('trip',{tripId:'${t.id}',tripTab:'bookings'})">Manage Trip</button>
      </div>
    </div>`;
  }).join('') : `<div class="card empty"><h4>Nothing here yet</h4>
      <p>${want==='draft'?'Drafts are trips you have started building but not published.'
        :want==='joined'?'Trips somebody else is running that you booked onto yourself.'
        :'When a trip moves into this state it will show up here.'}</p></div>`;

  return topbar([{t:'Trips'},{t:title}]) + `<div class="view">
    <div class="view-head">
      <div><h1>${title}</h1>
        <p>Everything Uluwatu Surf Collective is running, and what each one is owed.</p></div>
      <div class="spacer"></div>
      <div class="seg">${['USD','EUR'].map(c=>`<button aria-pressed="${S.cur===c}" onclick="S.cur='${c}';render()">${c}</button>`).join('')}</div>
      <div class="seg">
        <button aria-pressed="true">List</button>
        <button aria-pressed="false" onclick="toast('Calendar view is out of scope for this mockup.')">Calendar</button>
      </div>
    </div>

    ${want==='upcoming' ? `<div class="grid-4" style="margin-bottom:18px">
      ${statCard('Expected', money0(p.expected,S.cur), `${p.going} travellers · ${nCur} ${S.cur} trip${nCur===1?'':'s'}`,'', 'Everything booked on trips priced in this currency, paid or not. Money never mixes across currencies.')}
      ${statCard('Collected', money0(p.paid,S.cur), p.expected?`${Math.round(p.paid/p.expected*100)}% of expected`:'—', 'var(--ok)')}
      ${statCard('Past due', money0(p.pastDue,S.cur), p.pastDue?'Chase these first':'Nothing overdue', p.pastDue?'var(--danger)':'var(--muted)', 'Installments whose date has passed and are still unpaid.')}
      ${statCard('Waiting on you', p.unsigned + p.incomplete, `${p.unsigned} unsigned waivers · ${p.incomplete} incomplete forms`, 'var(--warn)')}
    </div>` : ''}

    <div class="toolbar">
      <div class="search">${ICON.search}<input type="text" placeholder="Search for participants and trips"></div>
      <button class="btn">Filters ${ICON.chev}</button>
      <button class="btn">Date created: Latest ${ICON.chev}</button>
    </div>
    ${rows}
  </div>`;
}

    const st = bookingStatus(b), bal = bookingBalance(b), p = pkgOf(t,b.pkg);
    const next = b.sched.find(r=>r.status==='pastdue') || b.sched.find(r=>r.status==='due') || b.sched.find(r=>r.status==='scheduled');
    return `<tr>
      <td><div style="display:flex;align-items:center;gap:9px">

    const qDone = questionsComplete(t,p), tDone = tasksComplete(t,p);
    return `<tr>
      <td><button class="linky" onclick="openParticipant('${b.id}','${esc(p.name)}')">${esc(p.name.split(' ')[0])}</button></td>
      <td>${esc(p.name.split(' ').slice(1).join(' '))}</td>
      <td>${esc(b.buyer)}</td>

      <td>${esc(pkgOf(t,b.pkg)?.name||'—')}</td>
      <td>${p.signed?`<span class="pill pill-ok">${ICON.check} Signed</span>`
                    :`<button class="pill" style="border:0" onclick="signFor('${b.id}','${esc(p.name)}')">Document not signed</button>`}</td>
      <td>${qDone?'<span class="pill pill-ok">Complete</span>':'<span class="pill pill-warn">Incomplete</span>'}</td>
      <td>${t.tasks.length ? (tDone?'<span class="pill pill-ok">Complete</span>':'<span class="pill pill-warn">Outstanding</span>') : '<span class="pill">—</span>'}</td>
      <td style="font-size:12px">${esc(p.answers?.[t.questions[0]?.id]||'—')}</td>

  }).join('');

  const s = tripStats(t);
  return `<div class="grid-4" style="margin-bottom:16px">
      ${statCard('On the trip', s.people, `${s.going} of ${t.cap} spots`)}
      ${statCard('Waivers signed', `${s.signed}/${s.people}`, s.unsigned?`${s.unsigned} still to chase`:'All done', s.unsigned?'var(--warn)':'var(--ok)')}
      ${statCard('Checkout info', `${s.checkoutDone}/${s.people}`, 'Answered at booking')}
      ${statCard('Before-you-fly tasks', `${s.tasksDone}/${s.people}`, t.tasks.length?`Due ${fmtShort(t.tasks[0].due)}`:'No tasks set', s.tasksDone<s.people?'var(--warn)':'var(--ok)')}

    <div class="card-head"><h3>Participants</h3><div class="spacer"></div>
      <button class="btn btn-sm">Filters ${ICON.chev}</button>
      <button class="btn btn-sm">Edit Columns</button>

      <thead><tr><th>First name</th><th>Last name</th><th>Buyer</th><th>Email</th><th>Package</th>
        <th>eSignature</th><th>Checkout Info</th><th>Tasks</th><th>${esc(t.questions[0]?.q||'—')}</th></tr></thead>
      <tbody>${body}</tbody></table></div>
  </div>
  ${s.unsigned?`<div style="display:flex;gap:9px;margin-top:14px;align-items:center;flex-wrap:wrap">
    <button class="btn btn-primary" onclick="chase('${t.id}','signature')">${ICON.sign} Request the ${s.unsigned} missing signature${s.unsigned>1?'s':''}</button>
    <button class="btn" onclick="chase('${t.id}','info')">Request missing information</button>
    <span style="font-size:12.5px;color:var(--muted)">Both send to exactly the people who are missing it.</span>
  </div>`:''}`;
}

const STEPS = [

function viewBuilder(){
  const t = trip(S.tripId);
  const done = { basics:true, page:true, packages:true, addons:true, info:true, esign:t.esign.on, settings:true };
  const body = { basics:stBasics, page:stPage, packages:stPackages, addons:stAddons,
                 info:stInfo, esign:stEsign, settings:stSettings }[S.builderStep](t);

  return topbar([{t:'Trips',go:"go('trips')"},{t:t.name,go:`go('trip',{tripId:'${t.id}'})`},{t:'Edit'}],
    `<button class="btn btn-sm" onclick="go('traveller')">${ICON.eye} Preview</button>

  + `<div class="view">

}

function stInfo(t){
  return `<div class="card"><div class="card-head"><h3>Participant Info</h3><div class="spacer"></div>
      <span class="pill">${t.questions.length + t.tasks.reduce((n,k)=>n+k.questions.length,0)} questions</span></div>
    <div class="card-pad">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <h4 style="font-size:13.5px">Checkout Info</h4>
        <span class="pill">Asked before payment</span>
        <div style="margin-left:auto"></div>
        <button class="btn btn-sm">Set lock date</button>
        <button class="btn btn-sm btn-primary" onclick="addQ('checkout')">${ICON.plus} Add question</button>
      </div>
      ${t.questions.map(q=>qRow(q,'checkout')).join('') || '<div class="empty" style="padding:22px"><p>No checkout questions yet.</p></div>'}

      <div style="height:22px"></div>
      ${t.tasks.map(tk=>`<div class="task-block">
        <div class="task-head"><h4>${esc(tk.name)}</h4>
          <span class="pill pill-accent">Due ${esc(tk.dueLabel)}</span>
          ${tk.reminders?'<span class="pill pill-ok">Reminders on</span>':''}
          <div style="margin-left:auto"></div>
          <button class="btn btn-sm btn-primary" onclick="addQ('${tk.id}')">${ICON.plus} Add question</button></div>
        ${tk.questions.map(q=>qRow(q,tk.id)).join('')}
        <div style="font-size:12px;color:var(--muted);margin-top:8px">
          Reminders go out 7 days before, 3 days before, on the day, and 2 days late — to the buyer only.</div>
      </div>`).join('')}
      <button class="btn" onclick="toast('A task groups questions behind one due date and one reminder schedule.')">${ICON.plus} Add task</button>

      <div class="note" style="margin-top:18px;margin-bottom:0">Two things worth knowing about this screen.
        There is <b>no conditional logic</b> — it is a flat list, so everyone answers everything. And only
        the <b>buyer</b> can fill it in, for themselves and for everyone they booked; participants never get
        a login.</div>
    </div></div>`;
}

function stEsign(t){
  const s = tripStats(t);
  return `<div class="card"><div class="card-head"><h3>eSignature</h3><span class="pill pill-accent">Pro</span></div>
    <div class="card-pad">
      <label class="switch"><input type="checkbox" ${t.esign.on?'checked':''} onchange="t=0;toast('The waiver is the one document the trip refuses to start without.')">
        <span><span class="sw-l">Require a signed document</span>
        <span class="sw-d">One PDF per trip. Combine your waiver and terms into a single file before uploading.</span></span></label>

      ${t.esign.on?`
      <div style="display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:var(--r);margin:13px 0;background:var(--panel)">
        <span style="color:var(--ok)">${ICON.file}</span>
        <div style="flex:1"><b style="font-size:13px">${esc(t.esign.file)}</b>
          <div style="font-size:12px;color:var(--muted)">${esc(t.esign.size)} · scanned and ready</div></div>
        <span class="pill pill-ok">${ICON.check} Ready</span>
        <button class="btn btn-sm">Replace</button>
      </div>
      <div class="grid-2">
        <div class="field"><label>Who should sign the document</label>
          <select><option>Everyone (buyer and all participants)</option><option>Buyer only</option></select></div>
        <div class="field"><label>&nbsp;</label>
          <label class="switch" style="padding-top:4px"><input type="checkbox" ${t.esign.mandatory?'checked':''}>
            <span><span class="sw-l">Required before payment</span>
            <span class="sw-d">Blocks the buyer at checkout. Others sign afterwards by email link.</span></span></label></div>
      </div>
      <div class="grid-4" style="margin-top:6px">
        ${statCard('Signed', `${s.signed}/${s.people}`, s.unsigned?'Chase the rest':'Everyone', s.unsigned?'var(--warn)':'var(--ok)')}
        ${statCard('Reminder cadence','2h · 2d','After booking, then again')}
        ${statCard('Fields on the PDF','0','Type your name at the bottom')}
        ${statCard('Review step','None','Signed or not signed')}
      </div>
      <div class="note" style="margin-top:16px;margin-bottom:0">There is no approval workflow here — a document
        is signed or it isn't. Nothing is ever <b>pending review</b>, <b>approved</b> or <b>rejected</b>, which
        matters if what you actually need to check is a passport rather than a signature.</div>
      `:''}
    </div></div>`;
}

function stSettings(t){
  const st = DB.settings;
  return `<div class="card"><div class="card-head"><h3>Who pays the fees?</h3></div><div class="card-pad">
      <div class="grid-2">
        <div>
          <div class="field"><label>Payment fees (when applicable) are paid by</label>
            <div style="display:grid;gap:6px">
              <label class="radio-row ${st.paymentFeesPaidBy==='organizer'?'on':''}">
                <input type="radio" name="pf" ${st.paymentFeesPaidBy==='organizer'?'checked':''} onchange="setFee('paymentFeesPaidBy','organizer')"> Organizer</label>
              <label class="radio-row ${st.paymentFeesPaidBy==='participant'?'on':''}">
                <input type="radio" name="pf" ${st.paymentFeesPaidBy==='participant'?'checked':''} onchange="setFee('paymentFeesPaidBy','participant')"> Participant</label>
            </div></div>
        </div>
        <div>
          <div class="field"><label>Platform fee is paid by</label>
            <div style="display:grid;gap:6px">
              <label class="radio-row ${st.wtFeePaidBy==='organizer'?'on':''}">
                <input type="radio" name="wf" ${st.wtFeePaidBy==='organizer'?'checked':''} onchange="setFee('wtFeePaidBy','organizer')"> Organizer</label>
              <label class="radio-row ${st.wtFeePaidBy==='participant'?'on':''}">
                <input type="radio" name="wf" ${st.wtFeePaidBy==='participant'?'checked':''} onchange="setFee('wtFeePaidBy','participant')"> Participant</label>
            </div></div>
        </div>
      </div>
      ${feePreview(t)}
      <div class="note" style="margin-top:16px;margin-bottom:0">Flip either of these and the traveller's
        checkout changes — go and look. Note what happens when they pay by <b>bank transfer</b>: the
        processing fee is genuinely zero, so the line disappears rather than showing ${money(0,t.cur)}.</div>
    </div></div>

    <div class="card" style="margin-top:16px"><div class="card-head"><h3>Cancellation policy</h3></div>
      <div class="card-pad">
        <div class="field"><label>Policy shown to travellers</label>
          <textarea rows="4">More than 60 days before departure: full refund less a ${money0(150,t.cur)} administration fee.
30–60 days: 50% refund. Inside 30 days: the deposit is non-refundable and no refund is available on the balance.</textarea>
          <div class="hint">Free text. Nothing here is enforced by the platform, calculated at checkout,
            or applied automatically when you cancel someone.</div></div>
      </div></div>`;
}

function feePreview(t){
  const p = t.packages[0] || {price:1000, deposit:200};
  const amt = p.deposit;
  const card = travellerAddOn(amt, t.cur, 'card');
  const bank = travellerAddOn(amt, t.cur, 'bank');
  return `<div class="card" style="box-shadow:none;background:var(--panel);margin-top:14px">
    <div class="card-head" style="border-color:var(--line)"><h3>What a traveller sees on a ${money0(amt,t.cur)} deposit</h3></div>
    <div class="card-pad"><div class="grid-2">
      <div><div class="stat-l" style="margin-bottom:7px">${ICON.card} Paying by card</div>
        <div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span style="color:var(--muted)">Deposit</span><b class="tnum">${money(amt,t.cur)}</b></div>
        ${card?`<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span style="color:var(--muted)">Service fee</span><b class="tnum">${money(card,t.cur)}</b></div>`:''}
        <div style="display:flex;justify-content:space-between;font-size:14px;padding:7px 0 0;border-top:1px solid var(--line);margin-top:5px"><b>Due at booking</b><b class="tnum">${money(amt+card,t.cur)}</b></div></div>
      <div><div class="stat-l" style="margin-bottom:7px">${ICON.bank} Paying by bank transfer</div>
        <div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span style="color:var(--muted)">Deposit</span><b class="tnum">${money(amt,t.cur)}</b></div>
        ${bank?`<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span style="color:var(--muted)">Service fee</span><b class="tnum">${money(bank,t.cur)}</b></div>`:''}
        <div style="display:flex;justify-content:space-between;font-size:14px;padding:7px 0 0;border-top:1px solid var(--line);margin-top:5px"><b>Due at booking</b><b class="tnum">${money(amt+bank,t.cur)}</b></div></div>
    </div></div></div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   PAYMENTS
   ═══════════════════════════════════════════════════════════════════════════ */
function viewPayments(){
  const tabs = [['balance','Balance'],['payouts','Payout Accounts'],['recipients','Recipients'],['requests','Payment Requests']];
  const body = { balance:payBalance, payouts:payPayouts, recipients:payRecipients, requests:payRequests }[S.payTab]();
  return topbar([{t:'Payments'},{t:tabs.find(x=>x[0]===S.payTab)[1]}]) + `<div class="view">
    <div class="view-head"><div><h1>Payments</h1>
      <p>What has cleared, what is still on its way to you, and who you owe.</p></div></div>
    <div class="tabs">${tabs.map(([id,l])=>`<button class="tab" aria-selected="${S.payTab===id}"
      onclick="S.payTab='${id}';render()">${l}</button>`).join('')}</div>
    ${body}</div>`;
}

function payBalance(){
  const p = portfolio('USD'), pe = portfolio('EUR');
  const clearing = 2450;
  return `<div class="grid-4" style="margin-bottom:18px">
      ${statCard('Available now', money0(DB.operator.balance.USD,'USD'), 'Withdraw whenever you want','var(--ok)',
        'Money that has cleared. There is no hold until departure.')}
      ${statCard('Clearing', money0(clearing,'USD'), 'Bank payments, 5–7 business days','var(--wait)')}
      ${statCard('Still to collect', money0(p.balance,'USD'), `${money0(p.pastDue,'USD')} of it past due`, p.pastDue?'var(--warn)':'')}
      ${statCard('EUR wallet', money0(DB.operator.balance.EUR,'EUR'), 'Held separately, converts free')}
    </div>

  <div class="grid-2">
    <div class="card"><div class="card-head"><h3>Move money</h3></div><div class="card-pad" style="display:grid;gap:9px">
      ${[['Pay out to your bank','Local transfer, 1–3 business days, no fee','Transfer'],
         ['Pay a supplier','Instant, free, both sides verified','Send'],
         ['Convert currency','USD to EUR at the daily rate, no fee','Convert'],
         ['International wire','3–5 business days, $15','Wire']].map(([a,b,c])=>
        `<div style="display:flex;gap:12px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:var(--r-sm)">
          <div style="flex:1"><b style="font-size:13px">${a}</b><div style="font-size:12px;color:var(--muted);margin-top:2px">${b}</div></div>
          <button class="btn btn-sm" onclick="toast('${c} — not wired up in the mockup.')">${c}</button></div>`).join('')}
    </div></div>

    <div class="card"><div class="card-head"><h3>Recent movements</h3><div class="spacer"></div>
        <button class="btn btn-sm" onclick="go('reports',{reportTab:'transactions'})">Full ledger ${ICON.arrow}</button></div>
      <div class="tbl-wrap"><table><thead><tr><th>Type</th><th>Description</th><th class="num">Amount</th><th>Date</th></tr></thead>
        <tbody>${ledger('USD').slice(0,7).map(r=>`<tr>
          <td>${r.amount<0?`<span class="pill pill-wait">${esc(r.type)}</span>`:`<span class="pill pill-ok">Payment</span>`}</td>
          <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.desc)}</td>
          <td class="num tnum" style="color:${r.amount<0?'var(--muted)':'var(--ok)'}">${r.amount<0?'−':''}${money(Math.abs(r.amount),'USD')}</td>
          <td>${fmtShort(r.date)}</td></tr>`).join('')}</tbody></table></div>
    </div>
  </div>
  <div class="note" style="margin-top:16px">Payouts are <b>manual and immediate</b> — nothing is escrowed
    until the trip runs. That is the single thing operators care most about, and the thing they complain
    loudest about when it stops being true.</div>`;
}

function payPayouts(){
  return `<div class="card"><div class="card-head"><h3>Payout Accounts</h3><div class="spacer"></div>
      <button class="btn btn-sm btn-primary">${ICON.plus} Add local payout account</button></div>
    <div class="card-pad"><div class="grid-2">
      ${[['USD','Chase ••4471','United States','Local · free · 1–3 days'],
         ['EUR','Revolut ••8820','Ireland (SEPA)','Local · free · 1–3 days'],
         ['IDR','BCA ••0193','Indonesia','International wire · $15 · 3–5 days']].map(([c,acct,where,how])=>
        `<div class="card" style="box-shadow:none"><div class="card-pad">
          <div style="display:flex;align-items:center;gap:10px"><span class="pill pill-accent">${c}</span>
            <b style="font-size:13.5px">${acct}</b></div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:6px">${where}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${how}</div>
          <button class="btn btn-sm" style="margin-top:11px">Transfer</button></div></div>`).join('')}
    </div></div></div>
  <div class="card" style="margin-top:16px"><div class="card-head"><h3>Payout history</h3></div>
    <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Kind</th><th>To</th><th class="num">Amount</th><th class="num">Fee</th><th>Status</th></tr></thead>
      <tbody>${DB.payouts.map(p=>`<tr><td>${fmtShort(p.date)}</td><td>${esc(p.kind)}</td><td>${esc(p.to)}</td>
        <td class="num tnum">${money(p.amount,p.cur)}</td><td class="num tnum">${p.fee?money(p.fee,p.cur):'—'}</td>
        <td><span class="pill pill-ok">${esc(p.status)}</span></td></tr>`).join('')}</tbody></table></div></div>`;
}

function payRecipients(){
  const tone = s => s==='Verified'?'pill-ok':s==='Invite Pending'?'pill-warn':'pill-wait';
  return `<div class="card"><div class="card-head"><h3>Recipients</h3><div class="spacer"></div>
      <button class="btn btn-sm btn-primary">${ICON.plus} Add recipient</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Supplier</th><th>What they do</th><th>Currency</th><th>Status</th><th></th></tr></thead>
      <tbody>${DB.recipients.map(r=>`<tr>
        <td><div style="display:flex;align-items:center;gap:9px"><span class="av av-sm">${initials(r.name)}</span>
          <div><b>${esc(r.name)}</b><div style="font-size:11.5px;color:var(--muted)">${esc(r.email)}</div></div></div></td>
        <td style="color:var(--muted)">${esc(r.note)}</td><td>${esc(r.cur)}</td>
        <td><span class="pill ${tone(r.status)}">${esc(r.status)}</span></td>
        <td class="num">${r.status==='Verified'
          ? `<button class="btn btn-sm" onclick="toast('Transfers between two verified accounts land in seconds, free.')">Transfer</button>`
          : `<span style="font-size:12px;color:var(--muted)">Can't be paid yet</span>`}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="note" style="margin-top:16px">Supplier payments only work between two independently verified
    accounts — which is why the villa in Bali has to finish its own onboarding before you can pay it,
    however long you have been working together.</div>`;
}

function payRequests(){
  return `<div class="card"><div class="card-head"><h3>Payment Requests</h3><div class="spacer"></div>
    <button class="btn btn-sm btn-primary">${ICON.plus} New request</button></div>
    <div class="card-pad"><div class="empty"><h4>No open requests</h4>
      <p>A payment request is the B2B invoice: a title, an amount, a due date and an attached invoice,
      sent to a business rather than a traveller. It can carry its own installments, a minimum of seven
      days apart.</p></div></div></div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   REPORTS
   ═══════════════════════════════════════════════════════════════════════════ */
function viewReports(){
  const tabs = [['upcoming','Upcoming Payments'],['payments','Payments'],['transactions','Transactions'],['cash','Cash Flow']];
  const body = { upcoming:repUpcoming, payments:repPayments, transactions:repTx, cash:repCash }[S.reportTab]();
  return topbar([{t:'Reports'},{t:tabs.find(x=>x[0]===S.reportTab)[1]}]) + `<div class="view">
    <div class="view-head"><div><h1>Reports</h1>
      <p>Three of these look backwards. Only the first one looks forwards.</p></div>
      <div class="spacer"></div>
      <div class="seg">${['USD','EUR'].map(c=>`<button aria-pressed="${S.cur===c}" onclick="S.cur='${c}';render()">${c}</button>`).join('')}</div>
    </div>
    <div class="tabs">${tabs.map(([id,l])=>`<button class="tab" aria-selected="${S.reportTab===id}"
      onclick="S.reportTab='${id}';render()">${l}</button>`).join('')}</div>
    ${body}</div>`;
}

function repUpcoming(){
  const data = upcomingByMonth(S.cur);
  const max = Math.max(1, ...data.map(d=>d.due+d.past));
  const totalDue = data.reduce((n,d)=>n+d.due,0), totalPast = data.reduce((n,d)=>n+d.past,0);
  return `<div class="grid-3" style="margin-bottom:16px">
      ${statCard('Scheduled to arrive', money0(totalDue,S.cur), 'Installments not yet due','var(--cyan-dark)')}
      ${statCard('Past due', money0(totalPast,S.cur), totalPast?'Already chaseable':'Nothing overdue', totalPast?'var(--danger)':'var(--muted)')}
      ${statCard('Bookings on a plan', DB.bookings.filter(b=>trip(b.trip).cur===S.cur && b.sched.length>1).length, 'Paying in installments')}
    </div>
  <div class="card"><div class="card-head"><h3>Upcoming Payments</h3><div class="spacer"></div>
      <div class="legend"><span><i style="background:var(--cyan)"></i>Due</span><span><i style="background:var(--danger)"></i>Past due</span></div></div>
    <div class="card-pad">
      ${data.length?`<div class="chart">${data.map(d=>`
        <div class="bar-wrap">
          <div class="bar-stack">
            ${d.due?`<div class="bar bar-due" style="height:${d.due/max*150}px" title="${money0(d.due,S.cur)} due"></div>`:''}
            ${d.past?`<div class="bar bar-past" style="height:${d.past/max*150}px" title="${money0(d.past,S.cur)} past due"></div>`:''}
          </div>
          <div class="bar-x">${d.label}</div>
          <div class="bar-x tnum" style="font-weight:600;color:var(--text)">${money0(d.due+d.past,S.cur)}</div>
        </div>`).join('')}</div>`
      :'<div class="empty"><p>Nothing scheduled in this currency.</p></div>'}
    </div></div>

  <div class="card" style="margin-top:16px"><div class="card-head"><h3>What is due, and from whom</h3></div>
    <div class="tbl-wrap"><table><thead><tr><th>Traveller</th><th>Trip</th><th>Installment</th><th>Due</th><th class="num">Amount</th><th>Status</th><th></th></tr></thead>
      <tbody>${DB.bookings.filter(b=>trip(b.trip).cur===S.cur).flatMap(b=>
        b.sched.filter(r=>r.status==='due'||r.status==='pastdue'||r.status==='failed').map((r,i)=>{
          const t = trip(b.trip);
          return `<tr><td><div style="display:flex;align-items:center;gap:9px"><span class="av av-sm">${initials(b.buyer)}</span>
              <button class="linky" onclick="openBooking('${b.id}')">${esc(b.buyer)}</button></div></td>
            <td style="color:var(--muted)">${esc(t.name)}</td><td>${esc(r.label)}</td>
            <td>${fmtShort(r.due)} <span style="color:var(--muted)">· ${relDays(r.due)}</span></td>
            <td class="num tnum">${money(r.amount,t.cur)}</td>
            <td>${r.status==='pastdue'?'<span class="pill pill-danger"><span class="dot"></span>Past due</span>'
                 :r.status==='failed'?'<span class="pill pill-danger">Failed</span>'
                 :b.autoBill?'<span class="pill pill-wait">Auto-billing</span>':'<span class="pill pill-warn">Reminder only</span>'}</td>
            <td class="num"><button class="btn btn-sm" onclick="takePayment('${b.id}',${b.sched.indexOf(r)})">Record payment</button></td></tr>`;
        })).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:26px">Nothing outstanding.</td></tr>'}
      </tbody></table></div></div>
  <div class="note" style="margin-top:16px">Record a payment here and watch it land: the trip header, the
    cash-flow report, the traveller's own booking page and the bar above all move together, because they
    are all reading the same schedule.</div>`;
}

function repPayments(){
  const rows = ledger(S.cur).filter(r=>r.amount>0);
  return `<div class="card"><div class="card-head"><h3>Payments Reporting</h3><div class="spacer"></div>
      <button class="btn btn-sm">Filters ${ICON.chev}</button>
      <button class="btn btn-sm btn-primary">${ICON.down} Export</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Amount</th><th>Customer</th><th>Trip</th><th>Method</th><th>Date</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td><div style="display:flex;align-items:center;gap:8px">
          <span style="color:var(--muted)">${r.method==='bank'?ICON.bank:ICON.card}</span>
          <b class="tnum">${money(r.amount,r.cur)}</b></div></td>
        <td>${esc(r.desc.split(' — ')[0])}</td>
        <td style="color:var(--muted)">${esc(r.desc.split(' — ')[1]||'')}</td>
        <td style="text-transform:capitalize;color:var(--muted)">${esc(r.method)}</td>
        <td>${fmtShort(r.date)}</td></tr>`).join('')}</tbody></table></div></div>`;
}

function repTx(){
  const rows = ledger(S.cur);
  let run = 0;
  const withRun = [...rows].reverse().map(r=>{ run += r.amount - r.fee - r.wt; return {...r, run}; }).reverse();
  return `<div class="card"><div class="card-head"><h3>Transaction Reporting</h3><div class="spacer"></div>
      <button class="btn btn-sm">Filters ${ICON.chev}</button>
      <button class="btn btn-sm">Accounting CSV</button>
      <button class="btn btn-sm btn-primary">${ICON.down} Export</button></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Type</th><th>Description</th><th class="num">Gross</th><th class="num">Processing</th>
        <th class="num">Platform</th><th class="num">Net</th><th class="num">Balance</th><th>Date</th></tr></thead>
      <tbody>${withRun.map(r=>`<tr>
        <td>${r.amount<0?`<span class="pill pill-wait">${esc(r.type)}</span>`:'<span class="pill pill-ok">Payment</span>'}</td>
        <td style="max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.desc)}</td>
        <td class="num tnum">${r.amount<0?'−':''}${money(Math.abs(r.amount),r.cur)}</td>
        <td class="num tnum" style="color:var(--muted)">${r.fee?'−'+money(r.fee,r.cur):'—'}</td>
        <td class="num tnum" style="color:var(--muted)">${r.wt?'−'+money(r.wt,r.cur):'—'}</td>
        <td class="num tnum"><b>${r.amount<0?'−':''}${money(Math.abs(r.amount)-r.fee-r.wt,r.cur)}</b></td>
        <td class="num tnum" style="color:var(--muted)">${money(r.run,r.cur)}</td>
        <td>${fmtShort(r.date)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="note" style="margin-top:16px">Processing and platform columns show <b>${money(0,S.cur)}</b> on
    every row where the traveller is set to absorb them — go to a trip's Settings tab and switch who pays,
    and this ledger rewrites itself.</div>`;
}

function repCash(){
  const rows = ledger(S.cur);
  const collected = rows.filter(r=>r.amount>0).reduce((n,r)=>n+r.amount,0);
  const fees = rows.reduce((n,r)=>n+r.fee+r.wt,0);
  const paidOut = -rows.filter(r=>r.amount<0).reduce((n,r)=>n+r.amount,0);
  const p = portfolio(S.cur);
  const months = upcomingByMonth(S.cur);
  return `<div class="grid-4" style="margin-bottom:16px">
      ${statCard('Payments collected', money0(collected,S.cur), 'Gross, before anything comes off')}
      ${statCard('Fees paid', money0(fees,S.cur), fees?'Your share of processing':'Travellers absorb them', fees?'var(--warn)':'var(--ok)')}
      ${statCard('Paid out', money0(paidOut,S.cur), 'To your bank and suppliers')}
      ${statCard('Net collected', money0(collected-fees,S.cur), 'What you actually kept','var(--ok)')}
    </div>
  <div class="grid-2">
    <div class="card"><div class="card-head"><h3>Where the money went</h3></div><div class="card-pad">
      ${[['Collected from travellers', collected, 'var(--ok)'],
         ['Processing and platform fees', -fees, 'var(--warn)'],
         ['Paid to suppliers and to you', -paidOut, 'var(--wait)']].map(([l,v,c])=>`
        <div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)">
          <span style="flex:1;font-size:13px">${l}</span>
          <b class="tnum" style="color:${c};font-family:var(--display)">${v<0?'−':''}${money(Math.abs(v),S.cur)}</b></div>`).join('')}
      <div style="display:flex;align-items:center;gap:12px;padding:13px 0 0">
        <span style="flex:1;font-size:14px;font-weight:600">Sitting in your balance</span>
        <b class="tnum" style="font-family:var(--display);font-size:17px">${money(DB.operator.balance[S.cur],S.cur)}</b></div>
      <div class="note" style="margin:16px 0 0">This report is historical only. Nothing here knows about the
        ${money0(p.balance,S.cur)} still to come — that lives in Upcoming Payments, on its own.</div>
    </div></div>
    <div class="card"><div class="card-head"><h3>Still to arrive</h3></div><div class="card-pad">
      <div class="chart" style="height:150px">${months.map(d=>{
        const max = Math.max(1,...months.map(m=>m.due+m.past));
        return `<div class="bar-wrap"><div class="bar-stack">
          ${d.due?`<div class="bar bar-due" style="height:${d.due/max*110}px"></div>`:''}
          ${d.past?`<div class="bar bar-past" style="height:${d.past/max*110}px"></div>`:''}
        </div><div class="bar-x">${d.label}</div></div>`;}).join('')}</div>
      <div style="text-align:center;margin-top:10px"><button class="btn btn-sm" onclick="S.reportTab='upcoming';render()">Open Upcoming Payments ${ICON.arrow}</button></div>
    </div></div>
  </div>`;
}

    <div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Value</th><th>Applies to</th><th class="num">Used</th><th>Runs until</th></tr></thead>

        <td><b style="font-family:var(--mono);font-size:12.5px">${esc(d.code)}</b></td>

      <tbody>${rows.map(([a,b,c])=>`<tr><td><b>${esc(a)}</b></td><td style="color:var(--muted)">${esc(b)}</td>
