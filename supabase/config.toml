project_id = "rfdhtvcmagsbxqntnepv"
[functions.geocode-place]
verify_jwt = true

[functions.swelly-trip-planning]
verify_jwt = true

[functions.swelly-trip-planning-copy]
verify_jwt = true

# Traveler passport fields. Always a logged-in caller.
[functions.group-document-passport]
verify_jwt = true

# Cron only. The gateway must let it through unauthenticated; the function
# gates itself on x-internal-secret / the service-role bearer.
[functions.purge-group-documents]
verify_jwt = false

# Operator connects their Stripe account. Always a logged-in caller.
[functions.stripe-connect-onboard]
verify_jwt = true

# Traveler starts a payment. Always a logged-in caller.
[functions.payments-checkout]
verify_jwt = true

# Operator refunds a traveler. Always a logged-in caller, and the function ALSO
# checks `money.manage` via trip_staff_can — the JWT proves who you are, the
# capability proves you may move money.
[functions.payments-refund]
verify_jwt = true

# Stripe calls this; it cannot present a Supabase JWT. The function gates itself
# on Stripe's signature, which is stronger. Deploy with --no-verify-jwt.
[functions.stripe-webhook]
verify_jwt = false

# The every-minute push dispatcher. Its cron authenticates with a service-role
# Bearer, which IS a valid JWT — so the gateway check stays ON (probed live
# 2026-08-20: an unauthenticated POST gets the gateway's 401, and the cron
# keeps draining the queue). This entry exists so a deploy can never silently
# flip that state.
[functions.dispatch-notification-queue]
verify_jwt = true

# The Connect endpoint — Stripe again, so the same rule, its own signing secret.
#
# ⚠️ This entry was MISSING until 2026-08-18, which made a plain
# `supabase functions deploy stripe-connect-webhook` a way to silently kill it:
# with no entry the CLI defaults verify_jwt to ON, the gateway 401s Stripe
# before the function runs, and the symptom is zero invocations rather than
# failing ones. That is the leading explanation for `stripe-webhook` going dead
# on 10 August and taking four payments with it.
[functions.stripe-connect-webhook]
verify_jwt = false

# Cron only — the daily Stripe Connect sweep. Same shape as
# purge-group-documents: the gateway lets it through, the function gates itself
# on x-internal-secret / the service-role bearer.
[functions.refresh-connect-accounts]
verify_jwt = false

# Cron only — the hourly cron calls it with ?token=<HEALTHCHECK_TOKEN>, not a
# JWT, and the function gates itself on that token. Live has the gateway open
# (verified 2026-08-18: an unauthenticated curl reaches the function's own
# `{"error":"unauthorized"}`); this entry was missing, so a plain deploy would
# have defaulted verify_jwt ON and silently 401'd the cron — the exact
# stripe-connect-webhook failure mode described above.
[functions.health-check]
verify_jwt = false
