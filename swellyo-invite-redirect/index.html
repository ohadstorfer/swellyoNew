<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0E0E10" />
  <title>You're invited to a Swellyo Surftrip</title>

  <!-- Open Graph tags drive link previews in WhatsApp, iMessage, Telegram, etc. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="You're invited to a Swellyo Surftrip" />
  <meta property="og:description" content="Tap to open the trip in the Swellyo app." />
  <meta property="og:image" content="https://swellyo-invite.netlify.app/swellyo-logo.png" />
  <meta property="og:image:width" content="768" />
  <meta property="og:image:height" content="768" />
  <meta property="og:url" content="https://swellyo-invite.netlify.app/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="You're invited to a Swellyo Surftrip" />
  <meta name="twitter:description" content="Tap to open the trip in the Swellyo app." />
  <meta name="twitter:image" content="https://swellyo-invite.netlify.app/swellyo-logo.png" />

  <!-- Universal Links / App Links handle the happy path before this page ever
       renders. This page only appears when the app is not installed. -->
  <style>
    :root {
      --bg: #0E0E10;
      --bg-2: #1a1a1d;
      --brand: #05BCD3;
      --brand-2: #0788B0;
      --text: #F4F6F7;
      --text-dim: #8A9097;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .wrap {
      width: 100%;
      max-width: 360px;
      animation: fadeUp 360ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: 112px;
      height: 112px;
      margin: 0 auto 24px;
      display: block;
      border-radius: 28px;
      box-shadow:
        0 18px 48px rgba(5, 188, 211, 0.18),
        0 0 0 1px rgba(255,255,255,0.04);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    p.sub {
      margin: 0 0 28px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-dim);
    }

    .dots {
      display: inline-flex;
      gap: 6px;
      margin-bottom: 28px;
    }
    .dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--brand);
      opacity: 0.4;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }
      50%      { opacity: 1;    transform: scale(1.1); }
    }

    .cta {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 999px;
      background: var(--brand);
      color: #06262d;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 120ms ease, filter 120ms ease;
    }
    .cta:hover { filter: brightness(1.08); }
    .cta:active { transform: translateY(1px); }

    .foot {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .foot a {
      color: var(--text-dim);
      text-decoration: underline;
      text-decoration-color: rgba(138, 144, 151, 0.45);
    }
  </style>

  <script>
    (function () {
      var APP_STORE  = "https://apps.apple.com/app/swellyo/id6762285335";
      var PLAY_STORE = "https://play.google.com/store/apps/details?id=com.swellyo.app";
      var MARKETING  = "https://www.swellyo.com";

      // How long to wait for the app to take over before giving up on it.
      var SCHEME_WAIT_MS = 1500;
      // If we cancelled the fallback (page blurred) but the user is still
      // looking at this page some time later, the app never actually opened.
      var REARM_WAIT_MS = 1200;
      // Nothing resolved at all — never leave the user on a spinner forever.
      var HARD_TIMEOUT_MS = 8000;

      var ua = navigator.userAgent || "";
      var uaLower = ua.toLowerCase();
      // iPadOS 13+ in its default "desktop" mode reports a Mac UA. The touch
      // point count is what separates a real Mac from an iPad pretending.
      var isIPadDesktop = /macintosh/.test(uaLower) && (navigator.maxTouchPoints || 0) > 1;
      var isIOS = /iphone|ipad|ipod/.test(uaLower) || isIPadDesktop;
      var isAndroid = /android/.test(uaLower);

      // Forward the invite params from this URL into the app via the custom
      // scheme. The native Linking listener (AppContent.tsx) parses the query
      // string and resolves the invite. Params in use: grouptrip, surftrip +
      // t, staff.
      var query = (window.location.search || "").replace(/^\?/, "");
      var schemeUrl = query ? "swellyo://?" + query : "swellyo://";

      // The store strips the query, so an invite does not survive an install.
      // Park it on the clipboard instead; the app reads it once on first
      // launch and resolves the invite from there (deferred deep link).
      // Must stay in sync with the reader in src/components/AppContent.tsx.
      var CLIPBOARD_PREFIX = "swellyo-invite:";
      function stashInvite() {
        if (!query) return;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            // Fire and forget. Without transient activation iOS rejects this,
            // which is why the Continue handler calls it from inside a click.
            navigator.clipboard.writeText(CLIPBOARD_PREFIX + query).catch(function () {});
          }
        } catch (e) { /* clipboard unavailable — the link still works, just not deferred */ }
      }

      var storeUrl;
      if (isIOS) storeUrl = APP_STORE;
      else if (isAndroid) storeUrl = PLAY_STORE;
      else storeUrl = MARKETING + (query ? "/?" + query : "");
      window.__swellyoStore = storeUrl;

      // Desktop: no app to open. Hand the invite params to the web app rather
      // than dropping them on the floor.
      if (!isIOS && !isAndroid) {
        // Keep the CTA working with the query attached, in case the automatic
        // replace below is blocked.
        window.__swellyoContinue = function (el) { el.href = storeUrl; return true; };
        requestAnimationFrame(function () { window.location.replace(storeUrl); });
        return;
      }

      // Mobile flow: try the custom scheme first. If the app is installed it
      // intercepts the navigation (the page goes hidden) and we cancel the
      // fallback. Otherwise we send them to the store.
      // This path still matters with Universal Links working, because in-app
      // browsers (WhatsApp, Instagram) do not honour them.
      var navigated = false;
      var fallbackTimer = null;
      var hardTimer = null;

      function goStore() {
        if (navigated) return;
        navigated = true;
        clearTimers();
        stashInvite();
        window.location.replace(storeUrl);
      }
      function clearTimers() {
        if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
        if (hardTimer) { clearTimeout(hardTimer); hardTimer = null; }
      }
      function armFallback(ms) {
        if (navigated || fallbackTimer) return;
        fallbackTimer = setTimeout(goStore, ms);
      }
      function cancelFallback() {
        if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
      }

      // Losing focus means the app probably took over — stop the store bounce.
      // But "probably" is not "definitely": a system alert, a pulled-down
      // notification shade, or an interrupted scheme handoff all blur the page
      // too. If we come back and are still here, the app did not open, so
      // re-arm. Previously this cancel was permanent and the page could sit on
      // the spinner forever with no way out.
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) cancelFallback();
        else armFallback(REARM_WAIT_MS);
      });
      window.addEventListener("pagehide", cancelFallback);
      window.addEventListener("blur", cancelFallback);
      window.addEventListener("focus", function () { armFallback(REARM_WAIT_MS); });

      // Backstop: whatever happens above, this page resolves to something.
      hardTimer = setTimeout(goStore, HARD_TIMEOUT_MS);

      // Best effort before the automatic attempt — on Android this succeeds,
      // on iOS it needs the Continue click (see the handler below).
      stashInvite();

      requestAnimationFrame(function () {
        armFallback(SCHEME_WAIT_MS);
        try {
          window.location.replace(schemeUrl);
        } catch (e) {
          goStore();
        }
      });

      // The Continue button is the ONLY handoff iOS reliably honours, because
      // it carries a real user gesture — the automatic location.replace above
      // is routinely ignored. So it must aim at the APP, not the store; it
      // used to be rewritten to the store URL, which is what guaranteed a
      // store bounce for users who already had the app installed.
      window.__swellyoContinue = function (el) {
        stashInvite();          // inside the click = the activation iOS wants
        el.href = schemeUrl;
        navigated = false;      // this is a fresh attempt
        clearTimers();
        armFallback(SCHEME_WAIT_MS);
        hardTimer = setTimeout(goStore, HARD_TIMEOUT_MS);
        return true;            // let the browser follow el.href
      };
    })();
  </script>
  <noscript>
    <!-- No meta-refresh here on purpose. It used to bounce to swellyo.com
         immediately, which threw the invite away, and markup cannot read the
         query string to forward it. Without JS the user sees the page and the
         Continue link, which is strictly better than a silent redirect. -->
  </noscript>
</head>
<body>
  <div class="wrap">
    <img src="swellyo-logo.png" class="logo" alt="Swellyo" />

    <h1>You're invited to a surftrip</h1>
    <p class="sub">Opening Swellyo. If you don't have the app yet, we'll send you to the store.</p>

    <div class="dots" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

    <div>
      <a class="cta" href="https://www.swellyo.com" onclick="return window.__swellyoContinue ? window.__swellyoContinue(this) : true">
        Continue
      </a>
    </div>

    <p class="foot">
      Or visit <a href="https://www.swellyo.com">swellyo.com</a>
    </p>
  </div>
</body>
</html>
